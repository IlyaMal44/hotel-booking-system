app:
  seed:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

spring:
  cloud:
    discovery:
      enabled: false

resilience4j:
  retry:
    instances:
      hotelService:
        maxAttempts: 3
        waitDuration: 10ms
        enableExponentialBackoff: false
