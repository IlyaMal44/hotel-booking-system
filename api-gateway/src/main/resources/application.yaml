server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: booking-users
          uri: lb://booking-service
          predicates:
            - Path=/api/user,/api/user/**,/user,/user/**
        - id: booking-one
          uri: lb://booking-service
          predicates:
            - Path=/api/booking,/api/booking/**
        - id: booking-list
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings,/api/bookings/**
        - id: hotels
          uri: lb://hotel-service
          predicates:
            - Path=/api/hotels,/api/hotels/**
        - id: rooms-recommend
          uri: lb://hotel-service
          predicates:
            - Path=/api/rooms/recommend
        - id: rooms-statistics
          uri: lb://hotel-service
          predicates:
            - Path=/api/rooms/statistics
        - id: rooms-collection
          uri: lb://hotel-service
          predicates:
            - Path=/api/rooms
        - id: room-by-id
          uri: lb://hotel-service
          predicates:
            - Path=/api/rooms/{id}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

app:
  jwt:
    secret: ${JWT_SECRET:hotel-booking-system-jwt-secret-key-2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${spring.application.name}] [traceId=%X{traceId:-}] [correlationId=%X{correlationId:-}] %logger{36} - %msg%n"
